name: Deploy meal planner

# Publishes meal-planner/ to GitHub Pages so it can be installed on phones.
# One-off setup: repo Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [master]
    paths: ['meal-planner/**', '.github/workflows/meal-planner-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meal-planner-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: meal-planner

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: meal-planner
      - id: deployment
        uses: actions/deploy-pages@v4
