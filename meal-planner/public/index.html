<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Meals</title>
  <meta name="description" content="Weekly family meal planner with shopping list">
  <meta name="theme-color" content="#2f7d4f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Meals">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">This week</h1>
    <div id="topbar-actions"></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="plan" class="active"><span aria-hidden="true">🗓️</span>Plan</button>
    <button data-tab="shop"><span aria-hidden="true">🛒</span>Shop</button>
    <button data-tab="freezer"><span aria-hidden="true">🧊</span>Freezer</button>
    <button data-tab="meals"><span aria-hidden="true">📖</span>Meals</button>
    <button data-tab="settings"><span aria-hidden="true">⚙️</span>Settings</button>
  </nav>

  <dialog id="sheet"><div id="sheet-body"></div></dialog>
  <div id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
